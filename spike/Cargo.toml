# Throwaway prototypes for the stack spike (specs/20261026-154808-stack-spike).
# Deleted before merge; kept reachable through the tag spike/stack-20261026.
[workspace]
resolver = "3"
members = ["capture", "native-preview", "slint-preview", "layered-preview", "audio-preview"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
capture = { path = "capture" }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
slint = "1.18"
slint-build = "1.18"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = "line-tables-only"
