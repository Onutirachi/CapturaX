<!doctype html>
<!-- Browser reference path (research R9, T015): the capture card through getUserMedia, as the
     previous CapturaX showed it in WebView2. Serve this folder on localhost and open it in Edge:
     from disk, Edge hides device names and ids. resizeMode "none"
     asks for the device's own mode, never a scaled copy. The frame rate is counted with
     requestVideoFrameCallback, so it is what the page actually presents.
     Keys: F or double click toggles fullscreen, S shows or hides the stats. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px; background: #1b1b1f; }
  select, button { font: inherit; color: inherit; background: #2c2c33; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
  #error { color: #ff8a80; }
  #stage { position: relative; flex: 1; min-height: 0; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #stats { position: absolute; right: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px;
           background: rgba(0, 0, 0, 0.55); font-variant-numeric: tabular-nums; white-space: pre; }
  #stats.hidden { display: none; }
</style>
</head>
<body>
<div id="bar">
  <select id="device" title="Video device"></select>
  <select id="mode" title="Mode"></select>
  <button id="fullscreen">Fullscreen (F)</button>
  <span id="error"></span>
</div>
<div id="stage">
  <video id="video" autoplay muted playsinline disablepictureinpicture></video>
  <div id="stats"></div>
</div>
<script>
  const RESOLUTIONS = [[3840, 2160], [2560, 1440], [1920, 1080], [1280, 720]];
  const RATES = [30, 50, 60, 120, 144, 240];
  const $ = (id) => document.getElementById(id);
  const video = $("video");
  let stream = null;

  function remember(key, value) { try { localStorage.setItem(key, value); } catch {} }
  function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }

  function stop() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }

  // Opened from disk, the browser may hide device ids (empty strings); an exact empty id matches no
  // device, so the device is then left unconstrained.
  function device() {
    return $("device").value ? { deviceId: { exact: $("device").value } } : {};
  }

  // Runs one step; a failure names the step, the error and the constraint that failed.
  async function step(name, fn) {
    try {
      return await fn();
    } catch (e) {
      throw new Error(`${name}: ${e.name} ${e.constraint || ""} ${e.message || ""}`.trim());
    }
  }

  async function listDevices() {
    // Labels and ids are empty until the page has access; keep it open while listing.
    const probe = await step("access", () => navigator.mediaDevices.getUserMedia({ video: true }));
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    probe.getTracks().forEach((t) => t.stop());
    const wanted = recall("device");
    $("device").replaceChildren(...devices.map((d) => new Option(d.label || d.deviceId, d.deviceId)));
    const pick = devices.find((d) => d.deviceId === wanted) || devices.find((d) => /ezcap/i.test(d.label)) || devices[0];
    if (!pick) throw new Error("no video device");
    $("device").value = pick.deviceId;
  }

  // Modes the device can reach: the usual sizes and rates within its capabilities. A combination it
  // does not offer fails when chosen and shows the error.
  async function listModes() {
    stop();
    const probe = await step("capabilities", () => navigator.mediaDevices.getUserMedia({ video: device() }));
    const caps = probe.getVideoTracks()[0].getCapabilities();
    probe.getTracks().forEach((t) => t.stop());
    const modes = [];
    for (const [w, h] of RESOLUTIONS) {
      if (caps.width && w > caps.width.max) continue;
      if (caps.height && h > caps.height.max) continue;
      for (const fps of RATES) {
        if (caps.frameRate && fps > caps.frameRate.max) continue;
        modes.push(`${w}x${h}@${fps}`);
      }
    }
    const wanted = new URLSearchParams(location.search).get("mode") || recall("mode");
    $("mode").replaceChildren(...modes.map((m) => new Option(m, m)));
    $("mode").value = modes.includes(wanted) ? wanted : modes.includes("1920x1080@60") ? "1920x1080@60" : modes[0];
  }

  async function start() {
    stop();
    $("error").textContent = "";
    const [size, fps] = $("mode").value.split("@");
    const [width, height] = size.split("x").map(Number);
    const rate = Number(fps);
    // Drivers report rates such as 59.94 or 60.0006, so an exact rate can match no native mode.
    const strict = { ...device(), width: { exact: width }, height: { exact: height },
                     frameRate: { min: rate * 0.99, max: rate * 1.01 }, resizeMode: "none" };
    const loose = { ...device(), width: { ideal: width }, height: { ideal: height },
                    frameRate: { ideal: rate }, resizeMode: "none" };
    try {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: strict });
      } catch (e) {
        if (e.name !== "OverconstrainedError") throw e;
        stream = await step("open (loose)", () => navigator.mediaDevices.getUserMedia({ video: loose }));
        const s = stream.getVideoTracks()[0].getSettings();
        $("error").textContent = `${$("mode").value} not offered as is (${e.constraint}); opened ${s.width}x${s.height}@${s.frameRate}`;
      }
      video.srcObject = stream;
      remember("device", $("device").value);
      remember("mode", $("mode").value);
    } catch (e) {
      $("error").textContent = `${$("mode").value}: ${e.message}`;
    }
  }

  // Frame rate presented by the page, counted per second, and the time from capture to the
  // expected display when the browser gives a capture time.
  let frames = 0, delays = [], lastPresented = null, missed = 0, windowStart = performance.now();
  function onFrame(now, meta) {
    frames++;
    if (lastPresented !== null && meta.presentedFrames > lastPresented + 1) missed += meta.presentedFrames - lastPresented - 1;
    lastPresented = meta.presentedFrames;
    if (meta.captureTime) delays.push(meta.expectedDisplayTime - meta.captureTime);
    if (now - windowStart >= 1000) {
      const s = stream && stream.getVideoTracks()[0].getSettings();
      delays.sort((a, b) => a - b);
      const delay = delays.length ? `${delays[delays.length >> 1].toFixed(1)} ms` : "n/a";
      $("stats").textContent =
        `${s ? `${s.width}x${s.height}@${s.frameRate} (${s.resizeMode || "?"})` : ""}\n` +
        `${(frames * 1000 / (now - windowStart)).toFixed(1)} fps, ${missed} skipped\n` +
        `capture → display ${delay}`;
      frames = 0; delays = []; missed = 0; windowStart = now;
    }
    video.requestVideoFrameCallback(onFrame);
  }
  video.requestVideoFrameCallback(onFrame);

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else $("stage").requestFullscreen();
  }

  $("device").onchange = async () => { await listModes(); await start(); };
  $("mode").onchange = start;
  $("fullscreen").onclick = toggleFullscreen;
  $("stage").ondblclick = toggleFullscreen;
  document.onkeydown = (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "f" || e.key === "F") toggleFullscreen();
    if (e.key === "s" || e.key === "S") $("stats").classList.toggle("hidden");
  };

  (async () => {
    try {
      await listDevices();
      await listModes();
      await start();
    } catch (e) {
      $("error").textContent = e.message;
    }
  })();
</script>
</body>
</html>
